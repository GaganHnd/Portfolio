<svg width="1000" height="600" viewBox="0 0 1000 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="600" fill="#0D0D0D"/>
  <rect x="20" y="20" width="960" height="560" stroke="rgba(255,255,255,0.08)"/>
  <text x="60" y="80" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">BRAND IDENTIFIERS • SYMPOSIUM</text>
  
  <!-- Four geometric mark studies in grid -->
  <!-- Mark 1 -->
  <rect x="80" y="140" width="180" height="180" fill="#070707" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="170" cy="230" r="50" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <rect x="145" y="205" width="50" height="50" fill="#FFFFFF"/>
  <text x="80" y="360" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12">MARK A / CIRCLE-SQUARE</text>

  <!-- Mark 2 -->
  <rect x="300" y="140" width="180" height="180" fill="#070707" stroke="rgba(255,255,255,0.1)"/>
  <path d="M330 290 L390 170 L450 290 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="390" cy="245" r="20" fill="#22C55E"/>
  <text x="300" y="360" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12">MARK B / DELTA-SPHERE</text>

  <!-- Mark 3 -->
  <rect x="520" y="140" width="180" height="180" fill="#070707" stroke="rgba(255,255,255,0.1)"/>
  <line x1="550" y1="200" x2="670" y2="200" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="550" y1="230" x2="630" y2="230" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="550" y1="260" x2="670" y2="260" stroke="#FFFFFF" stroke-width="8"/>
  <text x="520" y="360" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12">MARK C / DATA-BARS</text>

  <!-- Mark 4 -->
  <rect x="740" y="140" width="180" height="180" fill="#070707" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="830" cy="230" r="45" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 8"/>
  <circle cx="830" cy="230" r="20" stroke="#FFFFFF" stroke-width="2"/>
  <text x="740" y="360" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12">MARK D / ORBITAL-NODE</text>

  <text x="60" y="520" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="14">GEOMETRIC IDENTITY &amp; SYSTEM STUDY</text>
  <text x="60" y="545" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="11">RATIO TESTS 1:1 • HIGH RESOLUTION VECTOR</text>
</svg>
