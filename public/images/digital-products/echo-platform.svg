<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0A0A0A"/>
  
  <!-- Subtle Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="690" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="#050505" />
  
  <!-- Top Window Header -->
  <rect x="30" y="30" width="1140" height="48" fill="#0D0D0D" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="60" cy="54" r="5" fill="#333333"/>
  <circle cx="78" cy="54" r="5" fill="#333333"/>
  <circle cx="96" cy="54" r="5" fill="#333333"/>
  <text x="125" y="58" fill="#666666" font-family="monospace" font-size="12" letter-spacing="2">ECHO.AI // PLATFORM INTERFACE ARCHITECTURE</text>
  <rect x="1000" y="44" width="140" height="20" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="1015" y="58" fill="#10B981" font-family="monospace" font-size="10" letter-spacing="1">SYSTEM READY</text>

  <!-- Sidebar Wireframe -->
  <rect x="30" y="78" width="220" height="642" fill="#080808" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="50" y1="120" x2="210" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="50" y="140" width="120" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="50" y="170" width="150" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="200" width="110" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="230" width="140" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="260" width="90" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>

  <!-- Main Canvas Wireframe -->
  <!-- Top Telemetry Row -->
  <rect x="280" y="110" width="260" height="90" fill="#0D0D0D" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="300" y="140" fill="#888888" font-family="monospace" font-size="11">RAG EMBEDDINGS RETRIEVAL</text>
  <text x="300" y="175" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">Active Vector DB</text>

  <rect x="560" y="110" width="260" height="90" fill="#0D0D0D" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="580" y="140" fill="#888888" font-family="monospace" font-size="11">VOICE PIPELINE (VAPI)</text>
  <text x="580" y="175" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">Low-Latency Audio</text>

  <rect x="840" y="110" width="290" height="90" fill="#0D0D0D" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="860" y="140" fill="#888888" font-family="monospace" font-size="11">HUMAN HANDOFF SYSTEM</text>
  <text x="860" y="175" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">Smart Escalation</text>

  <!-- Central Interface Representation -->
  <rect x="280" y="225" width="850" height="450" fill="#080808" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Center Placeholder Telemetry -->
  <rect x="430" y="360" width="550" height="180" fill="#0E0E0E" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="705" y="415" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle" letter-spacing="1">ECHO PLATFORM SCREENSHOT</text>
  <text x="705" y="445" fill="#999999" font-family="monospace" font-size="12" text-anchor="middle">REPLACE WITH ACTUAL PRODUCT SCREENSHOT</text>
  <rect x="520" y="470" width="370" height="32" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="705" y="490" fill="#AAAAAA" font-family="monospace" font-size="11" text-anchor="middle">public/images/digital-products/echo-platform.png</text>

  <!-- Crosshairs -->
  <line x1="25" y1="30" x2="35" y2="30" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="30" y1="25" x2="30" y2="35" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="1165" y1="30" x2="1175" y2="30" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="1170" y1="25" x2="1170" y2="35" stroke="#FFFFFF" stroke-width="1"/>
</svg>
