  <rect x="420" y="110" width="710" height="560" fill="#080808" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="495" y="270" width="560" height="210" fill="#0E0E0E" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="775" y="340" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle" letter-spacing="1">AI STUDY ASSISTANT SCREENSHOT</text>
