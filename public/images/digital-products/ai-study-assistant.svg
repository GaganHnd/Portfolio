  <rect x="95" y="170" width="270" height="40" fill="#0E0E0E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="95" y="225" width="270" height="40" fill="#0E0E0E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="95" y="280" width="270" height="40" fill="#0E0E0E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="95" y="335" width="270" height="40" fill="#0E0E0E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <text x="95" y="420" fill="#AAAAAA" font-family="monospace" font-size="11">RESOURCE RECOMMENDATIONS</text>
  <rect x="95" y="445" width="120" height="30" fill="rgba(255,255,255,0.05)"/>
  <rect x="225" y="445" width="140" height="30" fill="rgba(255,255,255,0.05)"/>
  <rect x="95" y="490" width="270" height="30" fill="rgba(255,255,255,0.05)"/>

