  <text x="660" y="600" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-weight="600" font-size="16">FORM FOLLOWS SILENCE</text>
  <text x="660" y="625" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="12">Curated editorial typography &amp; layout systems</text>

  <text x="120" y="745" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">03 / EDITORIAL SYSTEM — VERVE</text>
  <text x="960" y="745" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">EDITORIAL • 2023</text>
