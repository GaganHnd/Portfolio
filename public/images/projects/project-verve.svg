<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0D0D0D"/>
  <rect x="1" y="1" width="1198" height="798" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Editorial Magazine Spread -->
  <!-- Left Page -->
  <rect x="120" y="100" width="460" height="600" fill="#080808" stroke="rgba(255,255,255,0.1)"/>
  <text x="160" y="180" fill="#FFFFFF" font-family="serif" font-style="italic" font-size="44">Verve Spatial</text>
  <text x="160" y="220" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" letter-spacing="2">ARCHITECTURAL REVIEW • VOL 04</text>
  <rect x="160" y="260" width="380" height="260" fill="#141414" stroke="rgba(255,255,255,0.05)"/>
  <!-- Abstract architectural perspective in image -->
  <path d="M160 520 L350 260 L540 520 Z" fill="none" stroke="rgba(255,255,255,0.2)"/>
  <line x1="350" y1="260" x2="350" y2="520" stroke="rgba(255,255,255,0.3)"/>
  
  <text x="160" y="560" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="14">A study in negative space and monolithic structures.</text>
  <text x="160" y="585" fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="11">Pagination 042 — 079</text>
  
  <!-- Right Page -->
