<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0D0D0D"/>
  <rect x="1" y="1" width="1198" height="798" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Horological Chronos Dial Graphic -->
  <circle cx="600" cy="400" r="220" fill="#050505" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="600" cy="400" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-dasharray="2 6"/>
  <circle cx="600" cy="400" r="120" fill="none" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="600" cy="400" r="6" fill="#22C55E"/>
  
  <!-- Dial Hands -->
  <line x1="600" y1="400" x2="600" y2="240" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="600" y1="400" x2="720" y2="400" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="400" x2="520" y2="480" stroke="#22C55E" stroke-width="1.5"/>

  <!-- Telemetry readout -->
  <text x="600" y="340" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="3">CHRONOS HOROLOGY</text>
  <text x="600" y="460" fill="#FFFFFF" font-family="monospace" font-size="18" text-anchor="middle" letter-spacing="2">+1.2 SEC / DAY</text>

  <!-- Left & right telemetry cards -->
  <rect x="140" y="280" width="180" height="240" fill="#070707" stroke="rgba(255,255,255,0.08)"/>
  <text x="160" y="320" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">POSITION CH</text>
  <text x="160" y="350" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="20">0.0 ms</text>
  <text x="160" y="390" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">AMPLITUDE</text>
  <text x="160" y="420" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="20">312°</text>

  <rect x="880" y="280" width="180" height="240" fill="#070707" stroke="rgba(255,255,255,0.08)"/>
  <text x="900" y="320" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">FREQUENCY</text>
  <text x="900" y="350" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="20">28,800</text>
  <text x="900" y="390" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10">STATUS</text>
  <text x="900" y="420" fill="#22C55E" font-family="sans-serif" font-weight="600" font-size="16">CALIBRATED</text>

  <text x="140" y="740" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">04 / INTERFACE DESIGN — CHRONOS TELEMETRY</text>
  <text x="960" y="740" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">UI/UX • 2023</text>
</svg>
