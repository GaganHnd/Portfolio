  <text x="120" y="740" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">05 / POSTER DESIGN — MONOLITH EXHIBITION</text>
  <text x="960" y="740" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="2">POSTER • 2023</text>
